name: Documentation
description: README, architecture documents, contributor guidance, or operational documentation
title: "[P1] [DOCS] "
labels:
  - documentation
assignees: []
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - blocks implementation/release
        - P1 - required documentation
        - P2 - normal documentation improvement
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background / Problem
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Documents / Scope
      description: List target files and what must change.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Basic / Detailed content design
      description: Required structure, source of truth, links, compatibility notes, and terminology.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Links resolve
        - [ ] No unimplemented feature is described as shipped
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Link checks, YAML/Markdown syntax, issue consistency, adversarial review.
    validations:
      required: true
