name: Phase C Protocol Regenerate

on:
  pull_request:
    paths:
      - "crates/orchestrator-protocol/**"
      - ".cargo/config.toml"
      - ".github/workflows/phase-c-regenerate.yml"

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate trusted protocol bindings
    if: >-
      github.actor == 'nntokyo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-30-contract-tooling'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/issue-30-contract-tooling

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Regenerate protocol bindings
        run: cargo test -p orchestrator-protocol --locked

      - name: Commit generated bindings
        shell: bash
        run: |
          if git diff --quiet -- src/generated; then
            echo "Generated protocol already matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated
          git commit -m "chore: regenerate typed protocol bindings"
          git push origin HEAD:feat/issue-30-contract-tooling
