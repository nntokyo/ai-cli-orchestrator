name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfiles:
    name: Generate lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: bootstrap-lockfiles
          path: |
            pnpm-lock.yaml
            Cargo.lock
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Verify ${{ matrix.os }}
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download generated lockfiles
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: bootstrap-lockfiles
          path: .

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Check TypeScript
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri binary without bundle
        run: pnpm tauri build --no-bundle
