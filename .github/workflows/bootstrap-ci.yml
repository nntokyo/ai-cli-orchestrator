name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfiles:
    name: Verify committed lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Verify pnpm lockfile
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Verify Cargo lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Regenerate protocol bindings
        run: cargo test -p orchestrator-protocol --locked

      - name: Verify generated protocol has no drift
        shell: bash
        run: |
          git diff --exit-code -- src/generated
          test -z "$(git status --porcelain -- src/generated)"

  verify:
    name: Verify ${{ matrix.os }}
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting and lint
        run: pnpm biome ci . --reporter=github

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Check TypeScript
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri binary without bundle
        run: pnpm tauri build --no-bundle

      - name: Runtime startup smoke (macOS)
        if: matrix.os == 'macos-14'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail

          app="$PWD/target/release/ai-cli-orchestrator"
          stdout_log="$RUNNER_TEMP/ai-cli-orchestrator-smoke.stdout.log"
          stderr_log="$RUNNER_TEMP/ai-cli-orchestrator-smoke.stderr.log"

          test -x "$app"

          "$app" >"$stdout_log" 2>"$stderr_log" &
          pid=$!

          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for _ in 1 2 3 4 5; do
                if ! kill -0 "$pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 "$pid" 2>/dev/null; then
                kill -9 "$pid" 2>/dev/null || true
              fi
            fi
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          sleep 5

          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || status=$?
            echo "Application exited during startup smoke (status=${status:-unknown})."
            echo "--- stdout ---"
            cat "$stdout_log" || true
            echo "--- stderr ---"
            cat "$stderr_log" || true
            exit 1
          fi

          echo "Application remained alive for the startup smoke window."

      - name: Runtime startup smoke (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $app = Join-Path $PWD "target\release\ai-cli-orchestrator.exe"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "ai-cli-orchestrator-smoke.stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "ai-cli-orchestrator-smoke.stderr.log"

          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "Missing executable: $app"
          }

          $process = Start-Process -FilePath $app -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru

          try {
            Start-Sleep -Seconds 5
            $process.Refresh()

            if ($process.HasExited) {
              Write-Host "Application exited during startup smoke with code $($process.ExitCode)."
              Write-Host "--- stdout ---"
              if (Test-Path -LiteralPath $stdoutLog) {
                Get-Content -LiteralPath $stdoutLog -ErrorAction SilentlyContinue
              }
              Write-Host "--- stderr ---"
              if (Test-Path -LiteralPath $stderrLog) {
                Get-Content -LiteralPath $stderrLog -ErrorAction SilentlyContinue
              }
              throw "Application exited during startup smoke."
            }

            Write-Host "Application remained alive for the startup smoke window."
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
            }
          }
