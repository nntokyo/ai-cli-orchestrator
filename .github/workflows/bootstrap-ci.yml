name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfiles:
    name: Generate lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-lockfiles
          path: |
            pnpm-lock.yaml
            Cargo.lock
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Verify ${{ matrix.os }}
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download generated lockfiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bootstrap-lockfiles
          path: .

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Check TypeScript
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri binary without bundle
        run: pnpm tauri build --no-bundle
