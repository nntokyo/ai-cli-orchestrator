name: Phase C Biome Normalize

on:
  pull_request:
    paths:
      - "package.json"
      - "biome.json"
      - "src/**"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/phase-c-format.yml"

permissions:
  contents: read

jobs:
  format:
    name: Normalize trusted Phase C branch with Biome
    if: >-
      github.actor == 'nntokyo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-30-contract-tooling'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/issue-30-contract-tooling

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Biome safe formatting and fixes
        run: pnpm biome check --write .

      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Biome produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize frontend files with Biome"
          git push origin HEAD:feat/issue-30-contract-tooling
