name: Issue 13 Cargo Lock Refresh

on:
  pull_request:
    paths:
      - "crates/orchestrator-core/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/issue-13-lock-refresh.yml"

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.actor == 'nntokyo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-13-session-identity'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/issue-13-session-identity

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Regenerate Cargo lockfile
        run: cargo generate-lockfile

      - name: Commit Cargo lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo lockfile for session identity"
          git push origin HEAD:feat/issue-13-session-identity
