name: Phase C Artifact Generation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/orchestrator-protocol/**"
      - ".cargo/config.toml"
      - "package.json"
      - "biome.json"
      - ".github/workflows/phase-c-artifacts.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Generate lockfiles and protocol bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      - name: Generate TypeScript protocol bindings
        run: cargo test -p orchestrator-protocol

      - name: Show generated files
        run: find src/generated -type f -maxdepth 3 -print

      - name: Upload generated artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: phase-c-generated
          path: |
            pnpm-lock.yaml
            Cargo.lock
            src/generated
          if-no-files-found: error
          retention-days: 3
