name: Phase C Artifact Generation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/orchestrator-protocol/**"
      - ".cargo/config.toml"
      - "package.json"
      - "biome.json"
      - ".github/workflows/phase-c-artifacts.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Generate lockfiles and protocol bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      - name: Generate TypeScript protocol bindings
        run: cargo test -p orchestrator-protocol

      - name: Show generated files
        run: find src/generated -type f -maxdepth 3 -print

      - name: Upload generated artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: phase-c-generated
          path: |
            pnpm-lock.yaml
            Cargo.lock
            src/generated
          if-no-files-found: error
          retention-days: 3


  persist:
    name: Persist generated Phase C artifacts
    needs: generate
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'nntokyo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-30-contract-tooling'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/issue-30-contract-tooling

      - name: Download generated artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: phase-c-generated
          path: .

      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock pnpm-lock.yaml src/generated &&              git ls-files --error-unmatch Cargo.lock pnpm-lock.yaml >/dev/null 2>&1 &&              git ls-files --error-unmatch src/generated/protocol/CoreEvent.ts >/dev/null 2>&1; then
            echo "Generated artifacts already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock pnpm-lock.yaml src/generated
          git commit -m "chore: commit generated protocol and lockfiles"
          git push origin HEAD:feat/issue-30-contract-tooling
